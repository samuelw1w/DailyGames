<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <title>Daily Hub</title>
  <meta name="description" content="Small daily puzzle games. A new set every midnight.">
  <link rel="stylesheet" href="shared/theme.css">
  <link rel="stylesheet" href="assets/hub.css">
</head>
<body>
  <div class="dg-app">
    <header class="today">
      <div>
        <h1>Today</h1>
        <p id="today"></p>
      </div>
      <span class="streak" id="streak"></span>
    </header>

    <div class="progress">
      <div class="dg-segs" id="segs" aria-hidden="true"></div>
      <p id="progress"></p>
    </div>

    <main class="sections" id="games" aria-label="Games"></main>

    <p class="dg-foot">Same puzzles for everyone, new ones at midnight. Your streaks are saved in this browser.</p>
  </div>
  <script type="module" src="assets/hub.js"></script>
</body>
</html>
