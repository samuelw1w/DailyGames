<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <title>Daily Hub</title>
  <meta name="description" content="A few small games a day, played as one series. Add up your points, then lock them in or risk them at the tables.">
  <link rel="stylesheet" href="shared/theme.css">
  <link rel="stylesheet" href="assets/hub.css">
</head>
<body>
  <div class="dg-app">
    <header class="today">
      <div>
        <h1 id="title">Today</h1>
        <p id="today"></p>
      </div>
      <a class="dg-ghost plus" id="plusBtn" href="plus/">Subscribe</a>
    </header>

    <div class="bank">
      <span><b id="balance">0</b> points to spend</span>
      <a class="dg-link" href="friends/">Friends</a>
    </div>

    <nav class="tabs" role="tablist" aria-label="Ways to play">
      <button type="button" role="tab" id="tab-series" aria-controls="series" aria-selected="true">The Series</button>
      <button type="button" role="tab" id="tab-episodes" aria-controls="episodes" aria-selected="false">Episodes</button>
    </nav>

    <nav class="days" id="days" aria-label="Day" hidden>
      <button type="button" id="prev" aria-label="Earlier day">‹</button>
      <b id="dayLabel"></b>
      <button type="button" id="next" aria-label="Later day">›</button>
    </nav>

    <main id="series" role="tabpanel" aria-labelledby="tab-series"></main>
    <main id="episodes" role="tabpanel" aria-labelledby="tab-episodes" hidden></main>

    <div id="ad"></div>
    <p class="dg-foot">Same games for everyone, new ones at midnight. Your scores are saved in this browser.</p>
  </div>
  <script type="module" src="assets/hub.js"></script>
</body>
</html>
