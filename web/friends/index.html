<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <title>Leaderboards · Daily Hub</title>
  <meta name="description" content="The best day's scores from everyone who played, and how yours compares with your friends'.">
  <link rel="stylesheet" href="../shared/theme.css">
  <script src="../shared/blinds.js"></script>
  <link rel="stylesheet" href="friends.css">
</head>
<body>
  <div class="dg-app">
    <header class="dg-head">
      <a href="../">Hub</a>
      <h1>Leaderboards</h1>
      <span class="no"></span>
      <p class="sub" id="sub"></p>
    </header>

    <nav class="tabs boards" role="tablist" aria-label="Leaderboard">
      <button type="button" role="tab" id="board-everyone" aria-selected="true">Everyone</button>
      <button type="button" role="tab" id="board-friends" aria-selected="false">Friends</button>
    </nav>

    <nav class="tabs" role="tablist" aria-label="Scores for">
      <button type="button" role="tab" id="tab-daily" aria-selected="true">Daily</button>
      <button type="button" role="tab" id="tab-all" aria-selected="false">All time</button>
    </nav>

    <nav class="days" id="days" aria-label="Day">
      <button type="button" id="prev" aria-label="Earlier day">‹</button>
      <b id="day"></b>
      <button type="button" id="next" aria-label="Later day">›</button>
    </nav>

    <main class="dg-view" id="view"></main>

    <p class="dg-foot" id="foot"></p>
  </div>
  <script type="module" src="friends.js"></script>
</body>
</html>
