<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <title>Friends · Daily Hub</title>
  <meta name="description" content="See how your day's score compares with your friends', today and on earlier days.">
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="friends.css">
</head>
<body>
  <div class="dg-app">
    <header class="dg-head">
      <a href="../">Hub</a>
      <h1>Friends</h1>
      <span class="no"></span>
      <p class="sub">Sample friends, to show how this page will work</p>
    </header>

    <nav class="tabs" role="tablist" aria-label="Scores for">
      <button type="button" role="tab" id="tab-daily" aria-selected="true">Daily</button>
      <button type="button" role="tab" id="tab-all" aria-selected="false">All time</button>
    </nav>

    <nav class="days" id="days" aria-label="Day">
      <button type="button" id="prev" aria-label="Earlier day">‹</button>
      <b id="day"></b>
      <button type="button" id="next" aria-label="Later day">›</button>
    </nav>

    <main class="dg-view" id="view"></main>

    <p class="dg-foot">These friends are made up, and so are their scores. Real ones need accounts, which the site doesn't have yet. Your own scores are real.</p>
  </div>
  <script type="module" src="friends.js"></script>
</body>
</html>
